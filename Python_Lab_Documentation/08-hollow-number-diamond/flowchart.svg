<svg xmlns="http://www.w3.org/2000/svg" width="900" height="642" viewBox="0 0 900 642"><rect width="100%" height="100%" fill="#f8fafc"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Hollow Number Diamond — Flowchart</text><rect x="125" y="58" width="650" height="54" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="91" text-anchor="middle" font-family="Arial" font-size="16">Start</text><path d="M450 112 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="140" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="173" text-anchor="middle" font-family="Arial" font-size="16">Read number of rows as an integer</text><path d="M450 194 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="222" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="16">If input is invalid, display an error message</text><path d="M450 276 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="304" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="337" text-anchor="middle" font-family="Arial" font-size="16">If rows is less than 1, display a validation message</text><path d="M450 358 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="386" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="419" text-anchor="middle" font-family="Arial" font-size="16">Print the upper half using spaces and edge numbers</text><path d="M450 440 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="468" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="501" text-anchor="middle" font-family="Arial" font-size="16">Print the lower half in reverse order</text><path d="M450 522 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="550" width="650" height="54" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="583" text-anchor="middle" font-family="Arial" font-size="16">Stop</text></svg>