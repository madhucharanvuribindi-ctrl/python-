<svg xmlns="http://www.w3.org/2000/svg" width="900" height="632" viewBox="0 0 900 632"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#172554">Hollow Number Diamond — Flowchart</text><ellipse cx="450" cy="85" rx="325" ry="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="91" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Start</text><path d="M450 112 V135" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,140 775,140 745,194 125,194" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="173" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Read number of rows as an integer</text><path d="M450 194 V217" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,222 775,222 745,276 125,276" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">If input is invalid, display an error message</text><path d="M450 276 V299" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,304 775,304 745,358 125,358" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="337" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">If rows is less than 1, display a validation message</text><path d="M450 358 V381" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,386 775,386 745,440 125,440" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="419" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Print the upper half using spaces and edge numbers</text><path d="M450 440 V463" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,468 775,468 745,522 125,522" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="501" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Print the lower half in reverse order</text><path d="M450 522 V545" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><ellipse cx="450" cy="577" rx="325" ry="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="583" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Stop</text></svg>