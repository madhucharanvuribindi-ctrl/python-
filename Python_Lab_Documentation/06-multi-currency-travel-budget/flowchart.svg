<svg xmlns="http://www.w3.org/2000/svg" width="900" height="960" viewBox="0 0 900 960"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#172554">Multi-Currency Travel Budget Analysis — Flowchart</text><ellipse cx="450" cy="85" rx="325" ry="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="91" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Start</text><path d="M450 112 V135" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="140" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="173" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Store exchange rates, conversion fee and travel budget</text><path d="M450 194 V217" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="222" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Store expenses with category, currency and amount</text><path d="M450 276 V299" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="304" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="337" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">For each expense, convert its amount into rupees</text><path d="M450 358 V381" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="386" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="419" text-anchor="middle" font-family="Arial" font-size="14" fill="#111827">Calculate the conversion fee and add it to the converted amount</text><path d="M450 440 V463" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="468" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="501" text-anchor="middle" font-family="Arial" font-size="14" fill="#111827">Add the final amount to total spending and its category total</text><path d="M450 522 V545" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,550 775,550 745,604 125,604" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="583" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Display each converted expense</text><path d="M450 604 V627" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="450,632 775,659 450,686 125,659" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="450" y="665" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Compare total spending with the budget</text><path d="M450 686 V709" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="714" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="747" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Find the category with the largest total</text><path d="M450 768 V791" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,796 775,796 745,850 125,850" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="829" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Display the budget result and largest category</text><path d="M450 850 V873" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><ellipse cx="450" cy="905" rx="325" ry="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="911" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Stop</text></svg>