<svg xmlns="http://www.w3.org/2000/svg" width="900" height="870" viewBox="0 0 900 870"><rect width="100%" height="100%" fill="#f8fafc"/><text x="450" y="24" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#172554">University Scholarship Allocation — Flowchart</text><rect x="125" y="58" width="650" height="54" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="91" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Start</text><path d="M450 112 V133 M443 126 L450 133 L457 126" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="140" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="173" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Store scholarship rules and student details</text><path d="M450 194 V215 M443 208 L450 215 L457 208" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="222" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Calculate each student's average marks</text><path d="M450 276 V297 M443 290 L450 297 L457 290" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="304" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="337" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Check that every subject mark is at least 50</text><path d="M450 358 V379 M443 372 L450 379 L457 372" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="386" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="419" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Check average, attendance and family-income conditions</text><path d="M450 440 V461 M443 454 L450 461 L457 454" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="468" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="501" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Add students who satisfy every condition to the eligible list</text><path d="M450 522 V543 M443 536 L450 543 L457 536" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="550" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="583" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Sort eligible students by average, attendance, income and name</text><path d="M450 604 V625 M443 618 L450 625 L457 618" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="632" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="665" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Award scholarships to the top three; waitlist the rest</text><path d="M450 686 V707 M443 700 L450 707 L457 700" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="714" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="747" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Display scholarship results</text><path d="M450 768 V789 M443 782 L450 789 L457 782" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="796" width="650" height="54" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="829" text-anchor="middle" font-family="Arial" font-size="16" fill="#111827">Stop</text></svg>