<svg xmlns="http://www.w3.org/2000/svg" width="900" height="878" viewBox="0 0 900 878"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#172554">University Scholarship Allocation — Flowchart</text><ellipse cx="450" cy="85" rx="325" ry="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="91" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Start</text><path d="M450 112 V135" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="140" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="173" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Store scholarship rules and student details</text><path d="M450 194 V217" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="222" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Calculate each student's average marks</text><path d="M450 276 V299" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="450,304 775,331 450,358 125,331" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="450" y="337" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Check that every subject mark is at least 50</text><path d="M450 358 V381" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="450,386 775,413 450,440 125,413" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="450" y="419" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Check average, attendance and family-income conditions</text><path d="M450 440 V463" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="468" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="501" text-anchor="middle" font-family="Arial" font-size="14" fill="#111827">Add students who satisfy every condition to the eligible list</text><path d="M450 522 V545" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="550" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="583" text-anchor="middle" font-family="Arial" font-size="14" fill="#111827">Sort eligible students by average, attendance, income and name</text><path d="M450 604 V627" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="632" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="665" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Award scholarships to the top three; waitlist the rest</text><path d="M450 686 V709" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,714 775,714 745,768 125,768" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="747" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Display scholarship results</text><path d="M450 768 V791" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><ellipse cx="450" cy="823" rx="325" ry="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="829" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Stop</text></svg>