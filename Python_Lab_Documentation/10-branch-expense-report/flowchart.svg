<svg xmlns="http://www.w3.org/2000/svg" width="900" height="888" viewBox="0 0 900 888"><rect width="100%" height="100%" fill="#f8fafc"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Branch Expense Report — Flowchart</text><rect x="125" y="58" width="650" height="54" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="91" text-anchor="middle" font-family="Arial" font-size="16">Start</text><path d="M450 112 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="140" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="173" text-anchor="middle" font-family="Arial" font-size="16">Store branches, categories and monthly expenses</text><path d="M450 194 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="222" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="16">Initialize branch and category totals</text><path d="M450 276 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="304" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="337" text-anchor="middle" font-family="Arial" font-size="16">For each branch, calculate each category's three-month total</text><path d="M450 358 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="386" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="419" text-anchor="middle" font-family="Arial" font-size="16">Add category totals to branch total and category totals</text><path d="M450 440 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="468" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="501" text-anchor="middle" font-family="Arial" font-size="16">Track largest category total within each branch</text><path d="M450 522 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="550" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="583" text-anchor="middle" font-family="Arial" font-size="16">Calculate branch monthly average</text><path d="M450 604 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="632" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="665" text-anchor="middle" font-family="Arial" font-size="16">Find branch with highest expenses</text><path d="M450 686 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="714" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="747" text-anchor="middle" font-family="Arial" font-size="16">Display totals and highest category</text><path d="M450 768 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="796" width="650" height="54" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="829" text-anchor="middle" font-family="Arial" font-size="16">Stop</text></svg>