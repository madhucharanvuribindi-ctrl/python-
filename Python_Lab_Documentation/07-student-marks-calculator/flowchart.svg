<svg xmlns="http://www.w3.org/2000/svg" width="900" height="724" viewBox="0 0 900 724"><rect width="100%" height="100%" fill="#f8fafc"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">Student Marks Calculator — Flowchart</text><rect x="125" y="58" width="650" height="54" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="91" text-anchor="middle" font-family="Arial" font-size="16">Start</text><path d="M450 112 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="140" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="173" text-anchor="middle" font-family="Arial" font-size="16">Read student name</text><path d="M450 194 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="222" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="16">Read marks for three subjects</text><path d="M450 276 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="304" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="337" text-anchor="middle" font-family="Arial" font-size="16">Calculate total marks</text><path d="M450 358 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="386" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="419" text-anchor="middle" font-family="Arial" font-size="16">Calculate average = total / 3</text><path d="M450 440 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="468" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="501" text-anchor="middle" font-family="Arial" font-size="16">If average is at least 40, display Pass; otherwise display Fail</text><path d="M450 522 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="550" width="650" height="54" rx="8" fill="white" stroke="#2563eb" stroke-width="2"/><text x="450" y="583" text-anchor="middle" font-family="Arial" font-size="16">Display name, total, average and result</text><path d="M450 604 v21 m-7 -7 l7 7 7 -7" stroke="#475569" stroke-width="2" fill="none"/><rect x="125" y="632" width="650" height="54" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="665" text-anchor="middle" font-family="Arial" font-size="16">Stop</text></svg>