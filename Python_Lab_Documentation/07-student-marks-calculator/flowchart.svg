<svg xmlns="http://www.w3.org/2000/svg" width="900" height="714" viewBox="0 0 900 714"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="450" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#172554">Student Marks Calculator — Flowchart</text><ellipse cx="450" cy="85" rx="325" ry="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="91" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Start</text><path d="M450 112 V135" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,140 775,140 745,194 125,194" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="173" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Read student name</text><path d="M450 194 V217" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,222 775,222 745,276 125,276" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="255" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Read marks for three subjects</text><path d="M450 276 V299" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="304" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="337" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Calculate total marks</text><path d="M450 358 V381" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="125" y="386" width="650" height="54" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="450" y="419" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Calculate average = total / 3</text><path d="M450 440 V463" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,468 775,468 745,522 125,522" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="501" text-anchor="middle" font-family="Arial" font-size="14" fill="#111827">If average is at least 40, display Pass; otherwise display Fail</text><path d="M450 522 V545" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><polygon points="155,550 775,550 745,604 125,604" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="450" y="583" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Display name, total, average and result</text><path d="M450 604 V627" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><ellipse cx="450" cy="659" rx="325" ry="27" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="665" text-anchor="middle" font-family="Arial" font-size="15" fill="#111827">Stop</text></svg>